{% extends 'base.html' %}{% block content %}<main class="reading"><p class="eyebrow">研究人员后台</p><h1>实验进度</h1><table><thead><tr><th>条件</th><th>已进入</th><th>已完成</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.code }}</td><td>{{ row.total }}</td><td>{{ row.completed or 0 }}</td></tr>{% endfor %}</tbody></table><p><a href="{{ url_for('experiment.export_csv',key=request.args.get('key')) }}">下载汇总 CSV</a>　<a href="{{ url_for('experiment.revisits_csv',key=request.args.get('key')) }}">下载重看事件 CSV（含原因）</a>　<a href="{{ url_for('experiment.revisit_reasons_csv',key=request.args.get('key')) }}">下载重看原因 CSV</a></p></main>{% endblock %}
