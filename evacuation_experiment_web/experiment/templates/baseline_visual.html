{% extends 'base.html' %}{% block content %}<main class="reading"><p class="eyebrow">空间视觉任务 {{ index + 1 }} / {{ total }}</p><h1>{{ title }}</h1><img class="full-map" src="{{ baseline_map_url }}" alt="基线测试地图"><p>{{ prompt }}</p><form method="post">{% for value,label in options %}<label class="option"><input type="radio" name="answer" value="{{ value }}" required><span>{{ value }}. {{ label }}</span></label>{% endfor %}<input id="started" type="hidden" name="started_ms"><button class="primary">确认答案</button></form></main>{% endblock %}{% block scripts %}<script>document.getElementById('started').value=Date.now();</script>{% endblock %}
