{% extends 'base.html' %}
{% block head %}
<style>
html,body{width:100%;height:100%;margin:0;padding:0}
body:has(.immersive-map){overflow:hidden}
body:has(.immersive-map) .site-header{display:none}
.immersive-map{position:fixed;inset:0;width:100vw;height:100dvh;min-height:0;margin:0;padding:10px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#edf2f1}
.revisit-frame{position:relative;width:100%;height:calc(100dvh - 20px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.revisit-frame>.full-map{display:block!important;height:100%!important;width:auto!important;max-height:100%!important;max-width:100%!important;object-fit:contain;margin:0 auto!important;box-sizing:border-box;border:1px solid #c9d4d0;background:#fff}
.revisit-timer{position:fixed;top:18px;right:24px;z-index:20;margin:0;padding:7px 12px;border-radius:6px;background:rgb(255 255 255 / .92);color:#25332f;font-size:15px;box-shadow:0 2px 10px rgb(0 0 0 / .10)}
.revisit-timer strong{font-size:17px}
@media(max-width:760px){.immersive-map{padding:6px}.revisit-frame{height:calc(100dvh - 12px)}.revisit-timer{top:10px;right:10px;font-size:12px}}
</style>
{% endblock %}
{% block content %}
<main class="map-stage immersive-map"><div class="revisit-frame"><img class="full-map" src="{{ map_url }}" alt="再次查看的商场疏散地图"></div><p class="revisit-timer">地图将在 <strong id="timer">{{ seconds }}</strong> 秒后自动关闭</p><form id="finish" method="post"></form></main>
{% endblock %}
{% block scripts %}<script>const form=document.getElementById('finish'),timer=document.getElementById('timer');let left={{ seconds }},sent=false;const submit=()=>{if(!sent){sent=true;form.submit()}};const tick=setInterval(()=>{left-=1;timer.textContent=Math.max(left,0);if(left<=0){clearInterval(tick);submit()}},1000);</script>{% endblock %}
