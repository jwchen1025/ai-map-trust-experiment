{% extends 'base.html' %}
{% block head %}
<style>
.literacy-anchors{display:flex;justify-content:space-between;gap:24px;margin-top:7px;color:var(--muted);font-size:12px;line-height:1.5}.literacy-anchors span{display:block;height:auto;padding:0;width:42%;border:0;border-radius:0;background:transparent;color:var(--muted);font-weight:400}.literacy-anchors span:last-child{text-align:right}@media(max-width:760px){.literacy-anchors{gap:12px;font-size:12px}.literacy-anchors span{width:46%}}
</style>
{% endblock %}
{% block content %}
<main class="reading"><p class="eyebrow">基线测量</p><h1>请先回答您使用地图的经验。</h1><p class="muted">请从 1 至 7 中选择最符合您实际情况的数字。</p><form method="post">{% for code,text in items %}<fieldset class="rating"><legend>{{ loop.index }}. {{ text }}</legend><div>{% for score in range(1,8) %}<label><input type="radio" name="{{ code }}" value="{{ score }}" required><span>{{ score }}</span></label>{% endfor %}</div><div class="literacy-anchors"><span>1 = 完全不符合</span><span>7 = 完全符合</span></div></fieldset>{% endfor %}<button class="primary">继续</button></form></main>
{% endblock %}
